<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
{{ partial "head.html" . }}
<body>
{{ partial "header.html" . }}

<main>
  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>{{ .Site.Title }}</h1>
      <p class="hero-description">{{ .Site.Params.description }}</p>
    </div>
  </section>

  <!-- Main Content -->
  <section class="home-content">
    <div class="container">
      <article>
        {{ .Content }}
      </article>
    </div>
  </section>

  <!-- Category Links -->
  <section class="category-links">
    <div class="container">
      <h3>Browse by Category</h3>
      <div class="category-grid">
        <a href="/vpn/" class="category-card">
          <span class="category-icon">🔐</span>
          <span class="category-name">VPN</span>
        </a>
        <a href="/crypto-casinos/" class="category-card">
          <span class="category-icon">🎰</span>
          <span class="category-name">Casinos</span>
        </a>
        <a href="/finance/" class="category-card">
          <span class="category-icon">💰</span>
          <span class="category-name">Finance</span>
        </a>
        <a href="/dating/" class="category-card">
          <span class="category-icon">💕</span>
          <span class="category-name">Dating</span>
        </a>
      </div>
    </div>
  </section>
</main>

{{ partial "footer.html" . }}
</body>
</html>
