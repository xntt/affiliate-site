<header class="site-header">
  <div class="container">
    <a href="/" class="logo">
      {{ with .Site.Params.site_logo }}
      <img src="{{ . }}" alt="{{ $.Site.Title }}">
      {{ else }}
      {{ .Site.Title }}
      {{ end }}
    </a>
    <nav class="main-nav">
      {{ range .Site.Sections }}
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      {{ end }}
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </div>
</header>
