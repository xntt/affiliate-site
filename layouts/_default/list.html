<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
{{ partial "head.html" . }}
<body>
{{ partial "header.html" . }}

<main>
  <!-- Hero -->
  <section class="hub-hero">
    <div class="container">
      <h1>{{ .Title }}</h1>
      <p class="hub-description">{{ .Description }}</p>
    </div>
  </section>

  <!-- Content -->
  <section class="home-content">
    <div class="container">
      {{ .Content }}
    </div>
  </section>
</main>

{{ partial "footer.html" . }}
</body>
</html>
