<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ block "head" . }}
  {{ partial "head.html" . }}
  {{ end }}
</head>
<body>
  {{ block "header" . }}
  {{ partial "header.html" . }}
  {{ end }}

  {{ block "main" . }}
  <main>
    {{ .Content }}
  </main>
  {{ end }}

  {{ block "footer" . }}
  {{ partial "footer.html" . }}
  {{ end }}
</body>
</html>
